    <style>

            background: rgba(0,255,255,.12); border: 1px solid #0ff; color: #0ff; letter-spacing: .15em; font-size: .85rem; display: none; }

    <button id="menu-btn" class="nav-btn">‹ MENÚ</button><button id="back-planet" class="nav-btn">VOLVER A LA ÓRBITA</button><button id="skip-btn" class="nav-btn">SALTAR INTRO ›</button>

    <script>
        window.__sg = false; window.__sgBusy = false; const __onSG = () => { window.__sg = true; if (window.__sgBusy) return; if (window.__enterVR) { window.__sgBusy = true; window.__enterVR(); } };
        try { if (navigator.xr && navigator.xr.addEventListener) navigator.xr.addEventListener('sessiongranted', __onSG); } catch (e) {} addEventListener('sessiongranted', __onSG);      // Quest: si llegás desde otra página que estaba en VR, el navegador avisa acá y se entra a VR solo
        // llegada desde el hub (directo=1): se ve la portada de niebla con INICIAR VUELO; si el navegador ya concede la sesion VR (sessiongranted) se entra directo al vuelo
        // ================= CONFIGURACIÓN DE TIMING =================
        const PLANET_RADIUS = 300;
        const PLANET_A = 900, PLANET_B = 750;   // órbita ovalada (semieje x / semieje z) · B es la distancia MÍNIMA al logo central: subila si todavía se tocan
        const LOGO_SCALE = 140;                  // tamaño del logo central (bajalo si querés darle aún más aire a los planetas)
        const BANK_DEADZONE = 0.05;              // rad/s de giro por debajo del cual los anillos quedan derechos (la órbita normal gira ~0.025)
        const BANK_GAIN = 1.2, BANK_MAX = 0.22; // cuánto se inclinan los anillos al girar, y tope (0.22 rad ≈ 12°)
        const BANK_SIGN = 1;                     // pone -1 si preferís que se inclinen hacia el lado contrario del giro
        const _bankAxis = new THREE.Vector3(); let bank = 0, prevYaw = 0;
        const PLANET_STAGGER = 120;               // planetas alternados arriba/abajo para que no se tapen entre sí (0 = todos al mismo nivel)
        const PLANET_SIZE = 95;
        const PS = PLANET_SIZE / 38;                // factor respecto del tamaño original (cartel, marciano y distancias de cámara se escalan con él)
        const CAMERA_RADIUS = 1250;              // la cámara orbita por afuera de los planetas (> PLANET_A + 250)
        const ORBIT_HEIGHT = 0;
        
        const CAMERA_START_Z = 0;
        const TUNNEL_END_Z = -10600;
        const EXPLORE_FORWARD = 9000;        // tramo de espacio que se recorre de frente entre la salida del túnel y el sistema
        const SOLAR_SYSTEM_Z = TUNNEL_END_Z - 1400 - EXPLORE_FORWARD;
        const STAR_CENTER_Z = -12000;        // centro del campo de estrellas (el mismo de antes, así hay estrellas durante todo el viaje)
        const TUNNEL_START_Z = 700;
        const IDLE_SPEED = 25;
        const VELOCIDAD_AVANCE = 1200;      // velocidad de crucero en el túnel (560 antes: el tunel duraba ~25 s)
        const TUNNEL_SPIN = 0.16;            // rad/seg
        const EXPLORE_SPEED = 2000;          // unidades/seg en exploración
        const XR_SCALE = 1;                  // escala del rig en VR (más sensación de profundidad)
        const wormAmp = z => smooth(0, 2000, -z) * smooth(TUNNEL_END_Z, TUNNEL_END_Z + 2000, z);
        const wormX = z => wormAmp(z) * (Math.sin(z * 0.0010) * 110 + Math.sin(z * 0.0021 + 1.3) * 25);   // curvas amplias
        const wormY = z => 30 + wormAmp(z) * (Math.sin(z * 0.0013) * 110 + Math.sin(z * 0.0029 + 0.7) * 22);   // lomas: subidas y bajadas suaves
        const wormR = z => 1 + 0.2 * wormAmp(z) * Math.sin(z * 0.0021 + 2.0);   // el túnel "respira"
        const SPAWN_DIST = 4200;
        const SOLAR_REVEAL_SECONDS = 4;
        
        const WORD_FADE_IN = 1.0;
        const WORD_FILL_OPACITY = 1.0;       // opacidad general de las letras (0-1) - máxima legibilidad
        const WORD_SLOW_MIN = 0.3;           // velocidad (x) al leer cada palabra: 0.3 = baja al 30 % de la de crucero · 1 = sin frenado
        const WORD_SLOW_IN = [1400, 1100];   // distancia a la palabra (u.) donde empieza a frenar → llega al mínimo
        const WORD_SLOW_OUT = [900, 600];    // distancia donde empieza a soltar → vuelve a la velocidad de crucero (las puertas se abren en 900)
        let wordSlow = 1;
        const WORD_BEND_R = 340;             // radio de la comba (concava hacia el espectador, como la pared del tunel): menor = mas combada, 0 = recta
        const NEON_BODY = '#581845';         // relleno de la letra: ciruela oscuro
        const NEON_GLOW = '#8e2a7c';         // halo del neon
        const NEON_CORE = '#c8559f';         // tubo de neon (borde de la letra)
        const NEON_HOT  = '#f2a9dc';
        const WORD_FILL = '#ffffff', WORD_FILL_BOT = '#d9f4f8';        // relleno de las letras del túnel: blanco (apenas celeste en la base)
        const WORD_RIM = '#0e7c93', WORD_RIM_LIGHT = '#8eeaf7', WORD_RIM_W = 16;   // contorno celeste petróleo, filo claro y su grosor
        const WORD_GLOW = '#1fb6d0', WORD_SHADOW = 'rgba(2,34,46,0.9)';              // brillo celeste y sombra oscura de contraste (para el fondo blanco)
        const NEON_RIM = '#bff6ff';                                    // color del destello que cruza cada palabra
        const NEON_FPX = 200, NEON_PAD = 150, NEON_WORLD_PER_PX = 60 / 200;   // resolucion de la textura y tamano en el mundo (igual que el size 60 anterior)
        const WORD_DEPTH = 22;               // grosor 3D de las letras
        const PETROL_DARK = [0.15, 0.10, 0.05], PETROL_LIGHT = [0.55, 0.40, 0.20];   // cobre/bronce (sombra / luz)
        const LETTER_FACE = 0xa9b0ba, LETTER_FACE_GLOW = 0x1a1f26;   // frente de las letras: plata (color / brillo propio)
        const LETTER_SIDE = 0x5d6672, LETTER_SIDE_GLOW = 0x0e1217;   // costados: acero (dan volumen a la plata)
        const LETTER_FACE_LAST = LETTER_FACE, LETTER_FACE_GLOW_LAST = LETTER_FACE_GLOW;   // última palabra (Nylon): igual que las demás (probado el ocre y no quedaba bien; poné otro hex acá si querés diferenciarla)
        const LETTER_OUTLINE = 0x070d14, OUTLINE_SIZE = 3.2;                   // contorno oscuro = sombra que despega la plata del fondo (color / grosor)
        const LETTER_LIGHT_TRIM = 0.5;      // las luces del túnel suman más de 3 y quemaban el color a blanco: se baja el albedo (subilo si las querés más claras)
        const NEBULA_GLOW = 0.55;                                    // intensidad del resplandor de fondo (1 = como antes, menos = menos encandila)
        const PETROL_ORANGE = [1.0, 0.85, 0.50];                                      // reflejo dorado en bordes
        const BASE_FOG_DENSITY = 0.00012;
        const SYSTEM_CENTER = new THREE.Vector3(0, 0, 0);
        const smooth = (e0, e1, x) => { const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

        // ================= MÁQUINA DE ESTADOS PARA CÁMARA =================
        let faseVuelo = 'tunel';  
        const centroSistema = new THREE.Vector3(0, 0, SOLAR_SYSTEM_Z);
        const currentLookAt = new THREE.Vector3(0, 0, 0);
        let orbitAngle = 0;
        const ORBIT_SPEED = -0.025; // NEGATIVO para empalme fluido a favor de la inercia

        // Spline de exploración (relativa al sistema): gran vuelta entre nebulosas y asteroides, llega por la derecha a la órbita
        const _rel = [[0,30,1400 + EXPLORE_FORWARD],[-80,70,1400 + EXPLORE_FORWARD - 1100],[-300,170,1400 + EXPLORE_FORWARD - 2400],[-420,60,1400 + EXPLORE_FORWARD - 3700],
                      [-250,-60,1400 + EXPLORE_FORWARD - 5000],[100,90,1400 + EXPLORE_FORWARD - 6300],[330,160,3000],[520,100,1900],[620,40,900],[CAMERA_RADIUS,0,0]];
        const curvaExplora = new THREE.CatmullRomCurve3(_rel.map(r => new THREE.Vector3(r[0], r[1], r[2] + SOLAR_SYSTEM_Z)), false, 'centripetal');
        const exploraLen = curvaExplora.getLength();
        let yawVel = 0, progresoExplora = 0, rig, yaw = 0, orbitFactor = 1, signal = null, hitMeshes = [];
        const raycaster = new THREE.Raycaster(), _v = new THREE.Vector3(), _v2 = new THREE.Vector3();
        const dampAngle = (a, b, k) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * k; };

        function planetPosition(i, n) {      // n = cantidad de planetas: se reparten parejo en la órbita
            const th = THREE.MathUtils.degToRad(-30 - (360 / n) * i);
            return new THREE.Vector3(PLANET_A * Math.cos(th), (i % 2 ? -1 : 1) * PLANET_STAGGER, PLANET_B * Math.sin(th));
        }

        let scene, camera, renderer, stars, nebula, asteroidField, tunnelGroup, tunnelLight, sistemaSolarGroup, sun, nebulaMat;
        const _solarCenter = new THREE.Vector3(), _sunOffset = new THREE.Vector3();
        const planets = [];
        const asteroidStates = [];
        const STARFIELD_DRIFT_SPEED = 0;
        const NEBULA_DRIFT_SPEED = 0;
        const PLANET_ORBIT_SPEED = 0.02;     // rad/seg · que se note el movimiento aunque la cámara esté quieta
        const STARFIELD_RADIUS = 15000;
        const ASTEROID_COUNT = 2600;
        const _asteroidDummy = new THREE.Object3D();
        let flightSpeed = IDLE_SPEED, skipBoost = 1;
        const MENU_URL = '';     // cuando el hub esté listo: 'index.html'. Vacío = el botón reinicia la experiencia (útil entre visitante y visitante)
        const vrBtns = []; let vrMenu, vrSkip, vrBack, vrHome, awaitHub = false;
        const goMenu = () => { if (MENU_URL) location.href = MENU_URL; else location.reload(); };
        let hasStartedFlight = false, experienceStartTime = null;
        let introWords = [], tiempoTotal = 0;
        let lastWordPassedTime = null;
        let solarRevealStartedAt = null, solarRevealComplete = false, solarFadeMaterials = [];
        let logoPivot = null; const _logoV = new THREE.Vector3();
        let planetTexturesReady = false, logoReady = false, introFontReady = false;
        const clock = new THREE.Clock();
        const INTRO_WORDS = ['Explorá', 'el', 'Universo', 'NYLON'];
        const WORD_SPLIT = { 'NYLON': 2 };      // dónde se parte cada palabra al abrirse (cantidad de letras de la mitad izquierda): NY | LON · las demás se parten por el límite entre letras más cercano al centro
        const WORD_Z = [-2200, -4600, -7000, -9400];

        function makeNoise(seed) {
            const p = new Uint8Array(512);
            let s = seed * 9301 + 49297;
            const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
            const perm = [...Array(256).keys()];
            for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
            for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
            const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
            const lerp = (a, b, t) => a + t * (b - a);
            const grad = (h, x, y, z) => {
                h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
                return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
            };
            return (x, y, z) => {
                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
                x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
                const u = fade(x), v = fade(y), w = fade(z);
                const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
                return lerp(lerp(lerp(grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z), u),
                                 lerp(grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z), u), v),
                            lerp(lerp(grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1), u),
                                 lerp(grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
            };
        }

        function fbm(noise, x, y, z, oct) {
            let v = 0, a = 0.5, f = 1;
            for (let i = 0; i < oct; i++) { v += a * noise(x * f, y * f, z * f); f *= 2; a *= 0.5; }
            return v; 
        }

        const hex = h => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
        function ramp(stops, t) {
            t = Math.min(1, Math.max(0, t));
            const n = stops.length - 1, i = Math.min(n - 1, Math.floor(t * n)), k = t * n - i;
            const a = stops[i], b = stops[i + 1];
            return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
        }

        function planetPixels(style, palette, seed, W, H) {      // función pura: corre en un Worker (la página no se traba) o, si no hay Worker, en el hilo principal
            const d = new Uint8ClampedArray(W * H * 4);
            const noise = makeNoise(seed), stops = palette.map(hex);
            for (let y = 0; y < H; y++) {
                const lat = (y / H) * Math.PI;
                for (let x = 0; x < W; x++) {
                    const lon = (x / W) * Math.PI * 2;
                    const sx = Math.sin(lat) * Math.cos(lon), sy = Math.cos(lat), sz = Math.sin(lat) * Math.sin(lon);
                    let t;
                    if (style === 'marble') {
                        const n = fbm(noise, sx * 2.5, sy * 2.5, sz * 2.5, 6);
                        t = 0.5 + 0.5 * Math.sin((sx + sy * 1.7) * 6 + n * 9);
                        t = Math.pow(t, 1.4) * 0.85 + 0.15 * (0.5 + n);
                    } else if (style === 'clouds') {
                        const warp = fbm(noise, sx * 3, sy * 3, sz * 3, 5);
                        t = 0.5 + 0.5 * Math.sin(sy * 14 + warp * 5) * 0.6 + fbm(noise, sx * 6, sy * 18, sz * 6, 4) * 0.5;
                    } else { 
                        const n = fbm(noise, sx * 3, sy * 3, sz * 3, 7);
                        const c = Math.abs(fbm(noise, sx * 8 + 10, sy * 8, sz * 8, 3));
                        t = 0.5 + n * 0.9 - c * 0.35;
                    }
                    const col = ramp(stops, t), i = (y * W + x) * 4;
                    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
                }
            }
            return d;
        }
        function generatePlanetCanvas(style, palette, seed) {
            const W = 1024, H = 512, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
            cv.getContext('2d').putImageData(new ImageData(planetPixels(style, palette, seed, W, H), W, H), 0, 0);
            return cv;
        }

        // ================= ROCAS ESPACIALES =================
        // Textura procedural gris (manchas, grano fino y grietas), se genera una sola vez y se comparte
        let rockTex = null;
        function generateRockTexture(seed) {
            const W = 512, H = 256, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
            const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), d = img.data, noise = makeNoise(seed);
            const stops = [0x303136, 0x505157, 0x76777c, 0x9d9ea1, 0xc4c3bf].map(hex);
            for (let y = 0; y < H; y++) {
                const lat = (y / H) * Math.PI;
                for (let x = 0; x < W; x++) {
                    const lon = (x / W) * Math.PI * 2, sx = Math.sin(lat) * Math.cos(lon), sy = Math.cos(lat), sz = Math.sin(lat) * Math.sin(lon);
                    const n = fbm(noise, sx * 3, sy * 3, sz * 3, 4);                       // manchas grandes claras/oscuras
                    const f = fbm(noise, sx * 14 + 7, sy * 14, sz * 14, 3);               // grano fino
                    const crack = Math.pow(1 - Math.abs(noise(sx * 3.5 + 3, sy * 3.5, sz * 3.5)), 9);   // grietas finas y poco frecuentes
                    const m = fbm(noise, sx * 2 + 20, sy * 2, sz * 2, 2);                 // parches más cálidos / más fríos
                    const col = ramp(stops, 0.5 + n * 1.0 + f * 0.3 - crack * 0.2), i = (y * W + x) * 4;
                    d[i] = col[0] * (1 + 0.1 * m); d[i + 1] = col[1]; d[i + 2] = col[2] * (1 - 0.1 * m); d[i + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            return cv;
        }
        // Forma irregular: esfera facetada deformada con ruido + cráteres + achatamiento propio. detail 2 = 180 caras, 3 = 320
        function makeRockGeometry(seed, detail) {

        function beginSolarReveal(elapsed) {
            solarRevealStartedAt = elapsed;
            solarFadeMaterials = [];
            sistemaSolarGroup.traverse(object => {
                if (!object.isMesh) return;
                const materials = Array.isArray(object.material) ? object.material : [object.material];
                materials.forEach(material => {
                    const fadeUniform = material.uniforms && material.uniforms.fadeOpacity;
                    solarFadeMaterials.push({
                        material, opacity: material.opacity, transparent: material.transparent,
                        depthWrite: material.depthWrite, fadeUniform, fadeOpacity: fadeUniform ? fadeUniform.value : null
                    });
                    if (fadeUniform) {
                        fadeUniform.value = 0;
                    } else {
                        material.transparent = true;
                        material.depthWrite = false;
                        material.opacity = 0;
                    }
                });
            });
        }

        function updateSolarReveal(elapsed) {
            if (solarRevealStartedAt === null) return;
            const opacity = smooth(0, 1, (elapsed - solarRevealStartedAt) / SOLAR_REVEAL_SECONDS); solarAlpha = opacity;
            solarFadeMaterials.forEach(state => {
                if (state.fadeUniform) {
                    state.fadeUniform.value = state.fadeOpacity * opacity;
                } else {
                    state.material.opacity = state.opacity * opacity;
                }
            });
            if (opacity < 1) return;
            solarFadeMaterials.forEach(state => {
                state.material.opacity = state.opacity;
                state.material.transparent = state.transparent;
                state.material.depthWrite = state.depthWrite;
                if (state.fadeUniform) state.fadeUniform.value = state.fadeOpacity;
            });
            solarFadeMaterials = [];
            solarRevealStartedAt = null;
            solarRevealComplete = true;
        }
