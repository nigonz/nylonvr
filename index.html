                b.onclick = async () => { ensureAudio(); const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] }); await renderer.xr.setSession(s); };
                window.__enterVR = () => { if (!renderer.xr.isPresenting) b.onclick(); }; if (window.__sg) window.__enterVR(); }).catch(() => { window.__xrSup = 'error'; coverNoVR(); });      // llegada desde Nylon ya en VR: entra sin tocar nada
            if (!navigator.xr) { window.__xrSup = 'sin navigator.xr'; coverNoVR(); }
            buildMotos();      // se leen los modelos ahora (pantalla de entrada), no durante la secuencia
            addEventListener('keydown', e => { const k = e.key === '1' ? 'a' : e.key === '2' ? 'b' : null; if (!k) return; MOTO_REVERSE[k] = !MOTO_REVERSE[k]; (k === 'a' ? hub.ia : hub.ib).rotation.y = MOTO_REVERSE[k] ? Math.PI : 0;      // prueba rápida: tecla 1 / 2 gira la moto A / B 180°
                setSub('Moto ' + k.toUpperCase() + ' → dejá MOTO_REVERSE.' + k + ' = ' + MOTO_REVERSE[k]); setTimeout(() => setSub(''), 3500); });
            try { document.fonts.load('700 64px "Space Grotesk"'); document.fonts.load('500 44px "Space Grotesk"'); } catch (e) {}
        }
        function animate() {
            const dt = Math.min(clock.getDelta(), 0.1);
            if (faseVuelo === 'hub' || faseVuelo === 'v360') { rig.position.copy(camPos); rig.rotation.set(0, yawFree, 0); if (!renderer.xr.isPresenting) camera.rotation.x = pitchFree; }
            if (faseVuelo === 'v360' && renderer.xr.isPresenting) [0, 1].forEach(i => { const c = renderer.xr.getController(i), src = c.userData.src, ax = src && src.gamepad && src.gamepad.axes; if (!ax) return; const sx = ax.length > 2 ? ax[2] : ax[0]; if (Math.abs(sx) > 0.25) cinWake(); if (Math.abs(sx) > 0.75 && !c.userData.stk) { c.userData.stk = 1; cinAct(sx > 0 ? 'fwd' : 'rew'); } else if (Math.abs(sx) < 0.35) c.userData.stk = 0; });      // en VR el joystick gira la vista dentro del video (la cabeza sigue girando normal)
            updateHub(dt); renderer.render(scene, camera);
        }
        window.onload = () => { init(); if (VOLVER) enterHub(); renderer.setAnimationLoop(animate); };
    </script>
